[package]
name = "settings"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
firefly-rust = { version = "0.15.0", features = ["alloc", "talc"] }
firefly-types = "0.12.0"
firefly-sudo = { version = "0.14.4", features = ["alloc"] }
firefly-ui = "0.3.2"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "s" # Optimize for speed.
lto = true      # Enable link-time optimization
